<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Welcome to a Bizarre Adventure</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ═══════════════════════════════════════
         🕷️ CURSEUR — TOILE D'ARAIGNÉE
    ═══════════════════════════════════════ -->

    <div id="spider-cursor">

        <div class="web">

            <span class="web-line line-1"></span>
            <span class="web-line line-2"></span>
            <span class="web-line line-3"></span>
            <span class="web-line line-4"></span>

            <span class="web-ring ring-1"></span>
            <span class="web-ring ring-2"></span>

        </div>

    </div>



    <main class="adventure">


        <!-- ╔══════════════════════════════════╗
             01 — WELCOME
        ╚══════════════════════════════════╝ -->

        <section
            class="page active"
            id="page-01"
        >

            <img
                src="images/welcome.png"
                alt="Welcome to a bizarre adventure"
                class="interface-image"
            >


            <!-- 🕰️ WARNING -->

            <div class="time-warning">

                <span class="warning-title">
                    WARNING
                </span>

                <span>
                    to go back in time, press
                    <strong>←</strong>
                </span>

            </div>


            <!-- WELCOME TO A BIZARRE ADVENTURE -->

            <button
                class="hotspot welcome"
                onclick="showPage('page-02')"
                aria-label="Enter the bizarre adventure"
            ></button>


            <!-- ═══════════════════════════════
                 👁️ FAUX BOUTON
            ═══════════════════════════════ -->

            <button
                class="strange-button strange-button-one"
                aria-label="Don't"
            >
                DON'T
            </button>


            <!-- ═══════════════════════════════
                 ✦ SYMBOLE SECRET
            ═══════════════════════════════ -->

            <button
                class="secret-symbol"
                aria-label="Something strange"
            >
                ✦
            </button>


            <!-- ═══════════════════════════════
                 🕯️ MESSAGE SECRET
            ═══════════════════════════════ -->

            <div id="strange-message">

                <span>
                    you weren't supposed to find this.
                </span>

            </div>

        </section>



        <!-- ╔══════════════════════════════════╗
             02 — LIFE / DEATH
        ╚══════════════════════════════════╝ -->

        <section
            class="page"
            id="page-02"
        >

            <img
                src="images/life_death.png"
                alt="Life or Death"
                class="interface-image"
            >


            <!-- LIFE -->

            <button
                class="hotspot life"
                onclick="showPage('page-03')"
                aria-label="Life"
            ></button>


            <!-- DEATH -->

            <button
                class="hotspot death"
                onclick="showPage('page-03-death')"
                aria-label="Death"
            ></button>



            <!-- ═══════════════════════════════════════
                 ☾ TITRE — THE DIVIDE
            ═══════════════════════════════════════ -->

            <div class="section-title divide-title">

                <span class="section-number">
                    02
                </span>

                <span class="section-name">
                    THE DIVIDE
                </span>

            </div>



            <!-- ═══════════════════════════════════════
                 🕯️ PETITE PHRASE
            ═══════════════════════════════════════ -->

            <div class="divide-whisper">

                choose carefully

            </div>



            <!-- ═══════════════════════════════════════
                 🕰️ HORLOGE ÉTRANGE
            ═══════════════════════════════════════ -->

            <div class="strange-clock">

                01:??:??

            </div>



            <!-- ═══════════════════════════════════════
                 👁️ FAUX BOUTON
            ═══════════════════════════════════════ -->

            <button
                class="restart-button"
                aria-label="Restart"
            >

                RESTART

            </button>



            <!-- ═══════════════════════════════════════
                 ✦ SYMBOLE SECRET
            ═══════════════════════════════════════ -->

            <button
                class="divide-secret"
                aria-label="Secret"
            >

                ✦

            </button>



            <!-- ═══════════════════════════════════════
                 🕯️ MESSAGE RESTART
            ═══════════════════════════════════════ -->

            <div id="restart-message">

                you never left.

            </div>

        </section>



       <!-- ╔══════════════════════════════════╗
     03 — LIFE
╚══════════════════════════════════╝ -->

<section
    class="page"
    id="page-03"
>

    <img
        src="images/reality_inbetween_ficition.png"
        alt="Reality, In Between and Fiction"
        class="interface-image"
    >


    <!-- ═══════════════════════════════════════
         ✦ TITRE — THE LIVING SIDE
    ═══════════════════════════════════════ -->

    <div class="section-title life-title">

        <span class="section-number">
            03
        </span>

        <span class="section-name">
            THE LIVING SIDE
        </span>

    </div>



    <!-- ═══════════════════════════════════════
         👁️ PETIT MESSAGE
    ═══════════════════════════════════════ -->

    <div class="life-whisper">

        everything is real<br>
        until it isn't

    </div>



    <!-- ═══════════════════════════════════════
         REALITY
    ═══════════════════════════════════════ -->

    <button
        class="hotspot reality"
        aria-label="Reality"
    ></button>



    <!-- ═══════════════════════════════════════
         IN BETWEEN
    ═══════════════════════════════════════ -->

    <button
        class="hotspot between"
        aria-label="In Between"
    ></button>



    <!-- ═══════════════════════════════════════
         FICTION
    ═══════════════════════════════════════ -->

    <button
        class="hotspot fiction"
        aria-label="Fiction"
    ></button>



    <!-- ═══════════════════════════════════════
         ✦ PETIT SYMBOLE
    ═══════════════════════════════════════ -->

    <button
        class="life-secret"
        aria-label="Something hidden"
    >
        +
    </button>


    <!-- ═══════════════════════════════════════
         🕯️ MESSAGE CACHÉ
    ═══════════════════════════════════════ -->

    <div id="life-secret-message">

        you're somewhere between.

    </div>

</section>


    <!-- ╔══════════════════════════════════╗
     03' — DEATH
╚══════════════════════════════════╝ -->

<section
    class="page"
    id="page-03-death"
>

    <img
        src="images/obss_ca_cons.png"
        alt="Obsession, Carpe Noctem and Conspirations"
        class="interface-image"
    >


    <!-- ═══════════════════════════════════════
         🕷️ TITRE — THE OTHER SIDE
    ═══════════════════════════════════════ -->

    <div class="section-title death-title">

        <span class="section-number">
            03'
        </span>

        <span class="section-name">
            THE OTHER SIDE
        </span>

    </div>



    <!-- ═══════════════════════════════════════
         🕯️ PETIT MESSAGE
    ═══════════════════════════════════════ -->

    <div class="death-whisper">

        don't look too long.

    </div>



    <!-- ═══════════════════════════════════════
         OBSESSION
    ═══════════════════════════════════════ -->

    <button
        class="hotspot obsession"
        aria-label="Obsession"
    ></button>



    <!-- ═══════════════════════════════════════
         CARPE NOCTEM
    ═══════════════════════════════════════ -->

    <button
        class="hotspot noctem"
        onclick="showPage('page-04')"
        aria-label="Carpe Noctem"
    ></button>



    <!-- ═══════════════════════════════════════
         CONSPIRATIONS
    ═══════════════════════════════════════ -->

    <button
        class="hotspot conspirations"
        aria-label="Conspirations"
    ></button>



    <!-- ═══════════════════════════════════════
         👁️ PETIT SYMBOLE
    ═══════════════════════════════════════ -->

    <button
        class="death-secret"
        aria-label="Do not click"
    >
        ?
    </button>



    <!-- ═══════════════════════════════════════
         🕸️ MESSAGE SECRET
    ═══════════════════════════════════════ -->

    <div id="death-secret-message">

        it knows you're here.

    </div>

</section>
        <!-- ╔══════════════════════════════════╗
             04 — CARPE NOCTEM
        ╚══════════════════════════════════╝ -->

        <section
            class="page"
            id="page-04"
        >

            <img
                src="images/chronique_library.png"
                alt="Carpe Noctem — Chroniques and Library"
                class="interface-image"
            >


            <!-- CŒUR GAUCHE → CHRONIQUES -->

            <button
                class="hotspot heart-left"
                onclick="showPage('page-chroniques')"
                aria-label="Chroniques"
            ></button>


            <!-- CŒUR DROIT → LIBRARY -->

            <button
                class="hotspot heart-right"
                onclick="showPage('page-library')"
                aria-label="Library"
            ></button>

        </section>



        <!-- ╔══════════════════════════════════╗
             CHRONIQUES
        ╚══════════════════════════════════╝ -->

        <section
            class="page"
            id="page-chroniques"
        >

            <img
                src="images/chroniques.png"
                alt="Chroniques"
                class="interface-image"
            >

        </section>



        <!-- ╔══════════════════════════════════╗
             LIBRARY
        ╚══════════════════════════════════╝ -->

        <section
            class="page"
            id="page-library"
        >

            <img
                src="images/library.png"
                alt="Library"
                class="interface-image"
            >

        </section>


    </main>



    <!-- ═══════════════════════════════════════
         🕷️ JAVASCRIPT
    ═══════════════════════════════════════ -->

    <script src="script.js"></script>


</body>

</html>
